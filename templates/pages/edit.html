<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Update Product</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f5f7fa;
      color: #333;
      min-height: 100vh;
      padding: 30px 15px;
    }

    .container {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      overflow: hidden;
    }

    .form-header {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
      padding: 28px 30px;
      text-align: center;
    }

    .form-header h2 {
      font-size: 1.7rem;
      margin-bottom: 6px;
    }

    .form-header p {
      opacity: 0.9;
      font-size: 0.95rem;
    }

    .form-body {
      padding: 30px;
    }

    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: 600;
      color: #374151;
      font-size: 0.95rem;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.2s ease;
      background-color: #f9fafb;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      outline: none;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background-color: white;
    }

    .errorlist {
      color: #ef4444;
      font-size: 0.85rem;
      margin-top: 6px;
      list-style: none;
    }

    .errorlist li::before {
      content: "• ";
    }

    .non-field-errors {
      background: #fee2e2;
      color: #991b1b;
      padding: 12px 16px;
      border-radius: 8px;
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.25s ease;
      margin-top: 12px;
    }

    .btn-submit:hover {
      background: #4338ca;
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25);
    }

    .btn-submit:active {
      transform: translateY(0);
    }

    @media (max-width: 480px) {
      .form-body {
        padding: 24px;
      }
      .form-header {
        padding: 24px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="form-header">
      <h2>Update Product</h2>
      <p>Modify product information</p>
    </div>

    <div class="form-body">
      <form method="POST">
        {% csrf_token %}

        {{ form.non_field_errors }}

        <div class="form-group">
          <label for="{{ form.barcode.id_for_label }}">Barcode</label>
          {{ form.barcode }}
          {{ form.barcode.errors }}
        </div>

        <div class="form-group">
          <label for="{{ form.title.id_for_label }}">Name</label>
          {{ form.title }}
          {{ form.title.errors }}
        </div>

        <div class="form-group">
          <label for="{{ form.price.id_for_label }}">Price</label>
          {{ form.price }}
          {{ form.price.errors }}
        </div>

        <div class="form-group">
          <label for="{{ form.quantity.id_for_label }}">Quantity</label>
          {{ form.quantity }}
          {{ form.quantity.errors }}
        </div>

        <div class="form-group">
          <label for="{{ form.sku.id_for_label }}">SKU</label>
          {{ form.sku }}
          {{ form.sku.errors }}
        </div>

        <button type="submit" class="btn-submit">Update Product</button>
      </form>
    </div>
  </div>

</body>
</html>
